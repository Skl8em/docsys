[project]
name = "docsys"
version = "0.1.0.dev0"
description = "Checks a project's documentation against the documentation system: frontmatter, identifiers, links, fixity."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Benjamin Claverie" }]
dependencies = ["pyyaml>=6"]

[project.scripts]
docsys = "docsys.cli:main"

[project.urls]
Repository = "https://github.com/Skl8em/docsys"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
# The one type checker, run the same way by the editor (the basedpyright extension
# finds this environment's copy) and by `tests/test_tooling.py`. Strict, plus `Any`
# refused wherever it appears: untyped data is bound to `object` and narrowed.
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"

[tool.ruff]
# Linter and formatter, run by the editor (the Ruff extension uses this
# environment's copy) and by `tests/test_tooling.py`. The Python version comes
# from `requires-python`.
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PT", "RUF", "SIM"]
# The en dash is deliberate in messages ("columns 0–4").
allowed-confusables = ["–"]
