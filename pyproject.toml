[project]
name = "docsys"
version = "0.1.0.dev0"
description = "Checks a project's documentation against the documentation system: frontmatter, identifiers, links, fixity."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Benjamin Claverie" }]
dependencies = ["pyyaml>=6"]

[project.scripts]
docsys = "docsys.cli:main"

[project.urls]
Repository = "https://github.com/Skl8em/docsys"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Every function is typed, the tests included; `tests/test_typing.py` runs this
# configuration, so the test suite fails on an unannotated or ill-typed function.
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
